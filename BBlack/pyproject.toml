

[build-system]
requires = ["setuptools>=58.0"]
build-backend = "setuptools.build_meta"

[project]
name = "BBlack"
authors = [
  { name = "Carole Périgois", email = "caroleperigois@outlook.com" }
]
maintainers = [
  { name = "Carole Périgois", email = "caroleperigois@outlook.com" },
]
description = "Bayesian analysis for Astrophysical model comparison with gravitational waves observations."
readme = "README.md"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.11",
]
dynamic = ["version"]
requires-python = ">=3.6"
dependencies = [ # write all needed libraries
  "emcee",
  "joblib",
  "numpy==1.26",
  "pycbc",
  "pandas",
  "scipy"
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "BBlack.__version__" }
